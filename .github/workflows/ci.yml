name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests migrations
      - run: ruff format --check src tests migrations
      - run: mypy src
      - run: pytest -q
      - run: pip-audit
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t routelearn:ci .
      - run: docker run --rm routelearn:ci doctor server
      - run: python3 tests/docker_server.py
      - run: python3 tests/docker_capture.py
      - run: python3 tests/docker_adguard.py
      - run: |
          ROUTELEARN_SERVER=http://server.example.test:8080 ROUTELEARN_AGENT_TOKEN=dummy \
          docker compose -f compose.yml -f compose.adguard.yml config --quiet
          ROUTELEARN_SERVER=http://server.example.test:8080 ROUTELEARN_AGENT_TOKEN=dummy \
          docker compose -f compose.agent.yml config --quiet
          ROUTELEARN_SERVER=http://server.example.test:8080 ROUTELEARN_AGENT_TOKEN=dummy \
          docker compose -f compose.dns-node.yml config --quiet
