[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routelearn"
version = "0.1.0"
description = "Learn service IPs from passive DNS and reconcile router policies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "httpx>=0.28,<1",
  "dnspython>=2.7,<3", "cryptography>=50,<51", "argon2-cffi>=23,<26",
  "scapy>=2.6,<3", "psutil>=6,<8", "yt-dlp>=2025.1", "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pip-audit>=2.9,<3"]

[project.scripts]
routelearn = "routelearn.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
routelearn = ["static/*", "static/assets/*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
